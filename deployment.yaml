apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssd-test-app
  namespace: ssd-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssd-test-app
  template:
    metadata:
      labels:
        app: ssd-test-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent      # Kyverno will rewrite this to Always
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
